[project]
name = "backdating-po"
version = "0.2.1"
description = "Builds a reporting-period-split, styled Excel report from raw PO receipt data."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.16,<0.17",
    "pip-audit>=2.7",
]
app = [
    # Floor is the oldest 1.x actually verified against tests/test_app.py's
    # AppTest smoke test (bumped from 1.38 after confirming 1.60 passes);
    # Dependabot + CI keep this floor from silently drifting out of date.
    "streamlit>=1.60,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # openpyxl's reader doesn't recognize the hand-authored Slicer <extLst>
    # extension excel_slicers.py writes (openpyxl has no write *or* read
    # support for Slicers - see excel_slicers.py's module docstring). Tests
    # that re-open a slicer-patched .xlsx with load_workbook() to prove the
    # patch didn't corrupt the file trigger this warning every time; it's
    # expected, not a bug, so it's silenced by its exact message rather than
    # broadly - any other UserWarning still surfaces normally.
    "ignore:Unknown extension is not supported and will be removed:UserWarning",
    # write_only worksheets have no _get_cell, so Worksheet.add_table always
    # warns that table columns must be added manually - which build_workbook
    # already does explicitly via TableColumn(...) above. Expected, not a bug.
    "ignore:In write-only mode you must add table columns manually:UserWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# E/F: pycodestyle+pyflakes core; I: import sorting; UP: pyupgrade; B: bugbear;
# C4: comprehensions; SIM: simplify; RUF: ruff-native checks. DTZ and the
# pylint (PL) longtail are intentionally excluded: this app works entirely
# with naive local calendar dates for PO receipts, so tz-aware datetimes are
# not meaningful, and PL's ruleset is broader/noisier than the "cheap gate"
# this project wants.
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# E501 (line-too-long) is intentionally off: several lines are atomic XML
# fragments or user-facing message strings that don't benefit from wrapping,
# and this project has no line-wrapping formatter to make the limit enforceable.
ignore = ["E501"]
